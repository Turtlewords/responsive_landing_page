<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <meta name="description" content="Perfume Gabrielle Essence Eau De Parfum A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Product preview card component</title>  
</head>
<body>
  <main>
    <div class="outer">
      <div class="inner-one">
        <picture>
          <source media="(min-width: 650px)" srcset="images\image-product-desktop.jpg">
          <img src="images/image-product-mobile.jpg" alt="a bottle of chanel perfurme">
        </picture>
        
      </div>
      <div class="inner-two">
        <p class="sub-head">Perfume</p>
        <h1>Gabrielle Essence Eau De Parfum</h1>
        <p class="text">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
          Perfumer-Creator for the House of CHANEL.</p>
          <p id="prices"><span class="price">$149.99</span><span class="old-price">$169.99</span></p>
          <a href="" id="add-to-cart" ><img src="images/icon-cart.svg">Add to Cart</a>
      </div>
    </div>
  </main>

  

  

  

  
  

  
  
  
</body>
</html>
